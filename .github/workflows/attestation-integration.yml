name: Sigstore Attestation Integration

on:
  push:
    paths:
      - '.github/workflows/attestation-integration.yml'
      - 'src/daddy_reviews/github_attestation.py'
      - 'tests/test_github_attestation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-genuine-github-attestation:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier and test suite
        run: python -m pip install -e '.[verification]' pytest
      - name: Run local policy contract tests
        run: pytest -q tests/test_github_attestation.py
      - name: Produce bounded test artifact for provenance (not a pass/fail certificate)
        run: |
          mkdir -p /tmp/daddy-sigstore
          printf 'GitHub provenance integration fixture, commit %s\n' "$GITHUB_SHA" > /tmp/daddy-sigstore/fixture.log
          test "$(wc -c < /tmp/daddy-sigstore/fixture.log)" -lt 65536
      - name: Attest the exact artifact with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: /tmp/daddy-sigstore/fixture.log
      - name: Download signed bundle and TUF trusted root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/daddy-sigstore
          gh attestation download fixture.log -R "$GITHUB_REPOSITORY"
          gh attestation trusted-root > trusted_root.jsonl
          test "$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f | wc -l)" -eq 1
      - name: Verify real signed bundle offline through Daddy Reviews
        run: |
          set -euo pipefail
          cd /tmp/daddy-sigstore
          bundle="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          gh_bin="$(readlink -f "$(command -v gh)")"
          gh_sha="$(sha256sum "$gh_bin" | cut -d ' ' -f 1)"
          artifact_sha="$(sha256sum fixture.log | cut -d ' ' -f 1)"
          python -m daddy_reviews.cli github-attestation-verify \
            --root "$GITHUB_WORKSPACE" \
            --attested-artifact-file fixture.log \
            --attestation-bundle-file "$bundle" \
            --sigstore-trusted-root-file trusted_root.jsonl \
            --gh-binary "$gh_bin" \
            --gh-binary-sha256 "$gh_sha" \
            --attestation-repo "$GITHUB_REPOSITORY" \
            --attestation-repo-id "$GITHUB_REPOSITORY_ID" \
            --attestation-commit "$GITHUB_SHA" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attestation-integration.yml" \
            --attestation-artifact-sha256 "$artifact_sha" > verified.json
          python - <<'PY'
          import json
          result = json.load(open('verified.json'))
          assert result['status'] == 'artifact_signature_and_identity_verified'
          assert result['platform_oidc_verified'] is True
          assert result['test_outcome_proven'] is False
          assert result['github_publication'] == result['merge_action'] == 'none'
          PY
      - name: Prove tampered artifact fails verification
        run: |
          set -euo pipefail
          cd /tmp/daddy-sigstore
          printf 'tampered\n' >> fixture.log
          bundle="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          gh_bin="$(readlink -f "$(command -v gh)")"
          gh_sha="$(sha256sum "$gh_bin" | cut -d ' ' -f 1)"
          original_sha="$(python -c 'import json;print(json.load(open("verified.json"))["artifact_sha256"])')"
          if python -m daddy_reviews.cli github-attestation-verify \
            --root "$GITHUB_WORKSPACE" \
            --attested-artifact-file fixture.log \
            --attestation-bundle-file "$bundle" \
            --sigstore-trusted-root-file trusted_root.jsonl \
            --gh-binary "$gh_bin" \
            --gh-binary-sha256 "$gh_sha" \
            --attestation-repo "$GITHUB_REPOSITORY" \
            --attestation-repo-id "$GITHUB_REPOSITORY_ID" \
            --attestation-commit "$GITHUB_SHA" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attestation-integration.yml" \
            --attestation-artifact-sha256 "$original_sha" >/dev/null 2>&1; then
            echo "Tampered artifact incorrectly verified" >&2
            exit 1
          fi
