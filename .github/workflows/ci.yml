name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build pinned .NET 8 Roslyn semantic helper
        working-directory: tooling/dotnet
        run: dotnet build DaddySemanticIndexer.csproj --configuration Release --nologo -p:NuGetAudit=false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tooling/typescript --ignore-scripts --no-audit --no-fund --no-package-lock
      - run: node -e "const v=require('./tooling/typescript/node_modules/typescript/package.json').version; if(v!=='6.0.3') process.exit(1)"
      - run: python -m pip install -e '.[verification]' pytest
      - name: Verify both semantic compiler tools are installed
        run: |
          java -version
          dotnet --version
          python -c "from daddy_reviews.compiled_semantic import JAVA_HELPER, CS_HELPER; assert JAVA_HELPER.is_file() and CS_HELPER.is_file()"
      - run: pytest -q
      - name: Require Java and Roslyn semantic integration tests
        run: pytest -q tests/test_compiled_semantic.py
      - run: python -m daddy_reviews.cli plan --task 'Review PR' --changed src/auth/tenant.py
      - run: python -m daddy_reviews.cli review --root . --base HEAD~1 --head HEAD
      - run: python -m daddy_reviews.cli evaluate --dataset evals/baseline.json
      - run: python -m daddy_reviews.cli quality-eval --dataset evals/quality_synthetic.json
      - run: python -m daddy_reviews.cli quality-compare --baseline-dataset evals/quality_synthetic.json --candidate-dataset evals/quality_synthetic.json
      - run: python -m daddy_reviews.cli graph --root . --changed src/daddy_reviews/graph.py > /dev/null
      - run: python -m daddy_reviews.cli capabilities --root . --query review > /dev/null
      - run: |
          python -m daddy_reviews.cli graph --root . > /tmp/daddy-reviews-graph.json
          python -m daddy_reviews.cli graph-diff --before-graph /tmp/daddy-reviews-graph.json --after-graph /tmp/daddy-reviews-graph.json > /dev/null
      - run: |
          python -m daddy_reviews.cli graph --root . --cache-file /tmp/daddy-reviews-cache.json > /dev/null
          python -m daddy_reviews.cli graph --root . --cache-file /tmp/daddy-reviews-cache.json > /dev/null
          python -m daddy_reviews.cli capabilities --root . --cache-file /tmp/daddy-reviews-cache.json --query review > /dev/null
      - run: |
          python -m daddy_reviews.cli graph --root . --cache-file /tmp/daddy-reviews-incremental.json > /tmp/daddy-reviews-first.json
          python -m daddy_reviews.cli graph --root . --cache-file /tmp/daddy-reviews-incremental.json > /tmp/daddy-reviews-second.json
          python -c "import json; p=json.load(open('/tmp/daddy-reviews-second.json')); assert p['cache']['status']=='hit' and p['cache']['parsed_files']==0"
      - run: python -m daddy_reviews.cli symbol-impact --root . --changed src/daddy_reviews/graph.py --symbol build_graph > /dev/null
      - run: pytest -q tests/test_python_reexports.py
      - run: pytest -q tests/test_js_symbols.py
      - run: |
          python -m daddy_reviews.cli snapshot --root . > /tmp/daddy-reviews-semantic-snapshot.json
          python -m daddy_reviews.cli snapshot-verify --root . --snapshot-file /tmp/daddy-reviews-semantic-snapshot.json > /dev/null
      - run: pytest -q tests/test_semantic_contracts.py tests/test_r7_context_scenarios.py
      - run: pytest -q tests/test_py_semantic.py
      - name: Require cross-layer evidence and ambiguity regressions
        run: pytest -q tests/test_cross_layer.py
      - name: Require ranked context, cache and all-language semantic integration tests
        run: pytest -q tests/test_context_engine.py
      - name: Require permissioned read-only investigation tool contracts
        run: pytest -q tests/test_investigation.py
      - name: Require specialist agent tool-call harness and citation regressions
        run: pytest -q tests/test_investigative_agents.py
      - name: Require independent authenticated GitHub completed-job checks
        run: pytest -q tests/test_github_job_status.py
      - name: Require supervised execution evidence, token isolation and attested-test CLI
        run: pytest -q tests/test_test_execution.py tests/test_attested_test_cli.py tests/test_attested_workflow_policy.py
      - name: Require offline GitHub OIDC/Sigstore artifact policy and human evidence bindings
        run: pytest -q tests/test_github_attestation.py tests/test_hosted_human_link.py
      - name: Require labeled human-resolution false-alarm and missed-defect regression scoring
        run: pytest -q tests/test_human_quality.py
      - name: Smoke-test synthetic human outcome regression gate
        run: |
          python -m daddy_reviews.cli human-resolution-eval --resolution-dataset evals/human_resolution_synthetic.json > /tmp/daddy-human-resolution.json
          python -m daddy_reviews.cli human-resolution-compare --baseline-dataset evals/human_resolution_synthetic.json --candidate-dataset evals/human_resolution_synthetic.json > /tmp/daddy-human-compare.json
          python - <<'PY'
          import json
          score = json.load(open('/tmp/daddy-human-resolution.json'))
          compare = json.load(open('/tmp/daddy-human-compare.json'))
          assert score['metrics']['tp'] == 3 and score['metrics']['fp'] == 1
          assert score['metrics']['fn'] == 1 and score['metrics']['abstained'] == 3
          assert score['dataset_kind'] == 'synthetic' and not score['promotion_eligible']
          assert compare['status'] == 'insufficient_evidence'
          assert not compare['real_world_accuracy_claim']
          PY
      - name: Require read-only operator input and signed runner receipt regressions
        run: pytest -q tests/test_operator_artifacts.py tests/test_ci_runner_receipts.py
      - name: Require signed human attestation and independent challenge conflict regressions
        run: pytest -q tests/test_human_resolution.py tests/test_verification_queue.py tests/test_independent_challenge.py
      - name: Require replay, human-label gate and paired-regression scenarios
        run: pytest -q tests/test_investigation_eval.py
      - name: Smoke-test deterministic replay and comparison CLI
        run: |
          python -m daddy_reviews.cli investigation-replay --replay-dataset evals/investigation_replay_synthetic.json > /tmp/investigation-replay.json
          python -m daddy_reviews.cli investigation-compare --baseline-replay /tmp/investigation-replay.json --candidate-replay /tmp/investigation-replay.json > /tmp/investigation-compare.json
          python - <<'PY'
          import json
          replay = json.load(open('/tmp/investigation-replay.json'))
          comparison = json.load(open('/tmp/investigation-compare.json'))
          assert replay['status'] == 'evaluated'
          assert replay['dataset_kind'] == 'synthetic' and replay['case_count'] == 10
          assert replay['metrics_by_tier']['all']['tp'] == 2
          assert replay['metrics_by_tier']['all']['fp'] == 2
          assert replay['metrics_by_tier']['all']['fn'] == 1
          assert comparison['status'] == 'insufficient_evidence'
          assert not comparison['promotion_eligible']
          assert not replay['production_model_quality_claim']
          PY
      - name: Smoke-test explicit-permission investigation CLI
        run: |
          python - <<'PY'
          import json, subprocess, sys
          base = [sys.executable, "-m", "daddy_reviews.cli", "investigate",
                  "--root", ".", "--tool", "read_file",
                  "--path", "src/daddy_reviews/investigation.py",
                  "--end-line", "3"]
          denied = subprocess.run(base, capture_output=True, text=True, timeout=30)
          assert denied.returncode == 2
          assert json.loads(denied.stdout)["status"] == "denied"
          allowed = subprocess.run(base + ["--allow-tool", "read_file"],
                                   capture_output=True, text=True, timeout=30)
          assert allowed.returncode == 0, allowed.stderr
          proof = json.loads(allowed.stdout)
          assert proof["status"] == "complete" and proof["evidence"][0]["source_sha256"]
          assert proof["trust"] == "untrusted_repository_source"
          PY
      - name: Smoke-test source-backed context CLI on repository
        run: |
          python - <<'PY'
          import json, subprocess, sys
          cmd = [sys.executable, "-m", "daddy_reviews.cli", "context",
                 "--root", ".", "--changed", "src/daddy_reviews/context_engine.py"]
          report = subprocess.run(cmd, capture_output=True, text=True, timeout=90)
          data = json.loads(report.stdout)
          assert data["format"] == "daddy-reviews-ranked-context-v1"
          assert data["context_bundle"] is not None
          assert data["coverage"]["returned_contexts"] > 0
          assert report.returncode == (0 if data["status"] == "complete" else 2)
          PY
      - name: Verify cross-layer CLI on repository sources
        run: python -m daddy_reviews.cli cross-layer --root . --changed src/daddy_reviews/cross_layer.py --max-depth 4 > /dev/null
      - run: python -m daddy_reviews.cli py-semantic --root . --changed src/daddy_reviews/py_semantic.py --symbol index_python > /dev/null
