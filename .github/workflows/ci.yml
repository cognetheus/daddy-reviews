name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python -m daddy_reviews.cli plan --task 'Review PR' --changed src/auth/tenant.py
      - run: python -m daddy_reviews.cli review --root . --base HEAD~1 --head HEAD
      - run: python -m daddy_reviews.cli evaluate --dataset evals/baseline.json
