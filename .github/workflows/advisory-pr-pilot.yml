name: Daddy Reviews Advisory PR Pilot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# No pull_request_target, secrets, deployment, OIDC, posting or merging.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: daddy-advisory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-only-pr-analysis:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The Python review TOOL comes from base, not the untrusted PR.
      - name: Checkout pinned trusted base reviewer tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: daddy-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout untrusted PR source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install tools strictly from base commit, never from reviewed PR
        run: python -m pip install --constraint daddy-tools/ci/requirements-constraints.txt -e './daddy-tools[verification]'
      - name: Analyze exact PR SHA using authenticated bounded GET only
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_REPO: ${{ github.repository }}
          PILOT_REPO_ID: ${{ github.repository_id }}
          PILOT_PR: ${{ github.event.pull_request.number }}
          PILOT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/daddy-pilot-public" "$RUNNER_TEMP/daddy-pilot-private"
          chmod 700 "$RUNNER_TEMP/daddy-pilot-public" "$RUNNER_TEMP/daddy-pilot-private"
          gh_exe="$(readlink -f "$(command -v gh)")"
          gh_digest="$(sha256sum "$gh_exe" | cut -d ' ' -f1)"
          python -m daddy_reviews.cli pilot-pr \
            --root "$GITHUB_WORKSPACE/pr-source" \
            --attestation-repo "$PILOT_REPO" \
            --attestation-repo-id "$PILOT_REPO_ID" \
            --pr "$PILOT_PR" \
            --expected-head-sha "$PILOT_HEAD" \
            --gh-binary "$gh_exe" \
            --gh-binary-sha256 "$gh_digest" \
            --pilot-private-output "$RUNNER_TEMP/daddy-pilot-private/review.json" \
            > "$RUNNER_TEMP/daddy-pilot-public/summary.json"
      - name: Verify source-free public summary and no autonomous action
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os
          public=Path(os.environ['RUNNER_TEMP'])/'daddy-pilot-public/summary.json'
          private=Path(os.environ['RUNNER_TEMP'])/'daddy-pilot-private/review.json'
          safe=json.loads(public.read_text())
          assert private.is_file()
          assert safe['format']=='daddy-reviews-pr-pilot-summary-v1'
          assert safe['status']=='advisory_source_read_verified'
          assert safe['source_text_in_summary'] is False
          assert safe['github_read_only'] is True
          assert safe['human_findings_verified'] is False
          assert safe['production_approval_granted'] is False
          assert safe['pr_comments_posted'] == 0
          assert safe['merge_action'] == 'none'
          assert safe['private_evidence_saved'] is True
          assert safe['private_evidence_not_published'] is True
          assert not public.is_symlink()
          print('Read-only PR source was reviewed; full findings remain private')
          PY
      - name: Upload ONLY source-free advisory PR summary for operator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daddy-pr-advisory-summary
          path: ${{ runner.temp }}/daddy-pilot-public/summary.json
          if-no-files-found: error
          retention-days: 7
