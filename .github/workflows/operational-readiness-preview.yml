name: Operational Readiness Preview

on:
  push:
    paths:
      - '.github/workflows/operational-readiness-preview.yml'
      - 'src/daddy_reviews/ops_telemetry.py'
      - 'src/daddy_reviews/ops_runtime.py'
      - 'src/daddy_reviews/ops_security.py'
      - 'src/daddy_reviews/ops_readiness.py'
      - 'src/daddy_reviews/cli.py'
      - 'tests/test_ops_telemetry.py'
      - 'tests/test_ops_runtime.py'
      - 'tests/test_ops_security.py'
      - 'tests/test_ops_readiness.py'
      - 'tests/test_ops_workflow_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-operations-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install constrained, nonprivileged reviewer tooling
        run: python -m pip install --constraint ci/requirements-constraints.txt -e '.[verification]' pytest
      - name: Enforce closed-schema metrics, resource and release regressions
        run: pytest -q tests/test_ops_telemetry.py tests/test_ops_runtime.py tests/test_ops_security.py tests/test_ops_readiness.py tests/test_ops_workflow_policy.py
      - name: Exercise genuine committed-source performance and fixed-process fault injection
        run: |
          set -euo pipefail
          mkdir -p /tmp/daddy-operational
          chmod 700 /tmp/daddy-operational
          python -m daddy_reviews.cli ops-preflight \
            --root "$GITHUB_WORKSPACE" \
            --base HEAD~1 --head HEAD \
            --ops-samples 2 \
            --ops-p95-ms 60000 \
            --ops-peak-kib 262144 > /tmp/daddy-operational/summary.json
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          folder=Path('/tmp/daddy-operational')
          result=json.loads((folder/'summary.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert result['format']=='daddy-reviews-operational-preflight-v1'
          assert result['source_commit']==sha
          assert result['benchmark']['status']=='local_benchmark_within_budget'
          assert result['benchmark']['sample_count']==2
          assert result['benchmark']['source_or_findings_included'] is False
          assert result['fault_injection']['status']=='failure_controls_verified'
          assert result['fault_injection']['scenario_count']==4
          assert result['telemetry']['status']=='local_candidate_within_budget'
          assert result['telemetry']['external_alert_sent'] is False
          assert result['static_security']['status']=='local_static_security_checks_passed'
          assert result['readiness']['status']=='local_operational_candidate'
          assert result['readiness']['release_authorized'] is False
          assert result['readiness']['external_release_blockers']
          assert result['readiness']['github_publication']==result['readiness']['merge_action']=='none'
          print('Actual source benchmark and injected failure controls met local candidate budgets')
          PY
      - name: Prove local evidence can NEVER authorize production release
        run: |
          set -euo pipefail
          if python -m daddy_reviews.cli ops-readiness \
              --root "$GITHUB_WORKSPACE" \
              --ops-evidence-file /tmp/daddy-operational/summary.json \
              > /tmp/daddy-operational/acceptance.json; then
            echo "Unsafe: local evidence authorized production" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          result=json.load(open('/tmp/daddy-operational/acceptance.json'))
          assert result['status']=='local_operational_candidate'
          assert result['production_ready'] is False
          assert result['release_authorized'] is False
          assert result['github_branch_protection_proven'] is False
          assert result['external_human_defect_truth_proven'] is False
          assert result['human_signoff_required'] is True
          assert result['github_publication']==result['merge_action']=='none'
          PY
      - name: Upload ONLY source-free local candidate operational summary and blocked release report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daddy-ops-local-readiness-preview
          path: |
            /tmp/daddy-operational/summary.json
            /tmp/daddy-operational/acceptance.json
          if-no-files-found: error
          retention-days: 7
