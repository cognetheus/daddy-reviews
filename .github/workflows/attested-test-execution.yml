name: Attested Test Execution Integration

on:
  push:
    paths:
      - '.github/workflows/attested-test-execution.yml'
      - 'src/daddy_reviews/test_execution.py'
      - 'tests/test_test_execution.py'
      - 'tests/test_human_quality.py'
  workflow_dispatch:

permissions:
  contents: read

# Post-run assurance is deliberately OUTSIDE this workflow: it cannot inspect
# its final GitHub Actions conclusion until all jobs finish. The separate
# verify-attested-run-jobs.yml workflow cross-checks this run via GitHub API,
# with read-only tokens and no OIDC signing privileges.
jobs:
  run-fixed-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed-suite test dependencies without signing access
        run: python -m pip install -e '.[verification]' pytest
      - name: Capture ONE fixed bounded pytest suite in non-OIDC job
        run: |
          set -euo pipefail
          mkdir -p /tmp/daddy-attested-tests
          python - <<'PY'
          import json, os
          from pathlib import Path
          from daddy_reviews.test_execution import capture_fixed_ci_test
          assert not os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          assert not os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          record = capture_fixed_ci_test(
              Path(os.environ["GITHUB_WORKSPACE"]),
              repository=os.environ["GITHUB_REPOSITORY"],
              commit=os.environ["GITHUB_SHA"],
              workflow=os.environ["GITHUB_REPOSITORY"] + "/.github/workflows/attested-test-execution.yml",
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              timeout=90,
          )
          output = Path("/tmp/daddy-attested-tests/supervised.json")
          output.write_text(json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          assert output.stat().st_size <= 65_536
          assert record["outcome"] == "passed", "Supervised pytest suite failed"
          assert record["exit_code"] == 0 and record["output_complete"]
          print("Unprivileged supervisor recorded PASS; this is not independent test truth")
          PY
      - name: Transfer exact execution artifact to isolated attestation job
        uses: actions/upload-artifact@v4
        with:
          name: daddy-supervised-record
          path: /tmp/daddy-attested-tests/supervised.json
          if-no-files-found: error
          retention-days: 1

  sign-only:
    needs: run-fixed-suite
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      # This privileged job executes NO repository Python, shell, installer or
      # reviewed source. Only the approved artifact download and GitHub signer.
      - name: Download the bounded unprivileged test evidence
        uses: actions/download-artifact@v4
        with:
          name: daddy-supervised-record
          path: /tmp/daddy-attested-tests
      - name: Authenticate the artifact with GitHub Actions OIDC
        uses: actions/attest@v4
        with:
          subject-path: /tmp/daddy-attested-tests/supervised.json

  verify-attested:
    needs: sign-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline verifier without OIDC signing capability
        run: python -m pip install -e '.[verification]'
      - name: Download previously signed test evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: daddy-supervised-record
          path: /tmp/daddy-attested-tests
      - name: Validate executor schema before reading external signatures
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from daddy_reviews.test_execution import inspect_test_execution_artifact
          assert not os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          suite = Path(os.environ["GITHUB_WORKSPACE"]) / "tests/test_human_quality.py"
          result = inspect_test_execution_artifact(
              Path("/tmp/daddy-attested-tests/supervised.json").read_bytes(),
              expected_repository=os.environ["GITHUB_REPOSITORY"],
              expected_commit=os.environ["GITHUB_SHA"],
              expected_workflow=os.environ["GITHUB_REPOSITORY"] +
                  "/.github/workflows/attested-test-execution.yml",
              expected_run_id=int(os.environ["GITHUB_RUN_ID"]),
              expected_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              expected_suite_sha256=hashlib.sha256(suite.read_bytes()).hexdigest(),
          )
          assert result["status"] == "supervisor_recorded_passed"
          print("Unprivileged verification job validated source and process evidence")
          PY
      - name: Fetch genuine bundle and trusted roots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/daddy-attested-tests
          gh attestation download supervised.json -R "$GITHUB_REPOSITORY"
          gh attestation trusted-root > trusted_root.jsonl
          test "$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f | wc -l)" -eq 1
      - name: Verify signed GitHub origin and exact supervisor output
        run: |
          set -euo pipefail
          cd /tmp/daddy-attested-tests
          export BUNDLE="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          export GH_BIN="$(readlink -f "$(command -v gh)")"
          export GH_BIN_SHA="$(sha256sum "$GH_BIN" | cut -d ' ' -f 1)"
          export ARTIFACT_SHA="$(sha256sum supervised.json | cut -d ' ' -f 1)"
          export SUITE_SHA="$(sha256sum "$GITHUB_WORKSPACE/tests/test_human_quality.py" | cut -d ' ' -f 1)"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from daddy_reviews.test_execution import verify_execution_with_github_attestation
          result = verify_execution_with_github_attestation(
              artifact_file=Path("supervised.json"),
              bundle_file=Path(os.environ["BUNDLE"]),
              trusted_root_file=Path("trusted_root.jsonl"),
              gh_binary=Path(os.environ["GH_BIN"]),
              gh_binary_sha256=os.environ["GH_BIN_SHA"],
              expected_repo=os.environ["GITHUB_REPOSITORY"],
              expected_repo_id=int(os.environ["GITHUB_REPOSITORY_ID"]),
              expected_commit=os.environ["GITHUB_SHA"],
              signer_workflow=os.environ["GITHUB_REPOSITORY"] +
                  "/.github/workflows/attested-test-execution.yml",
              expected_artifact_sha256=os.environ["ARTIFACT_SHA"],
              expected_run_id=int(os.environ["GITHUB_RUN_ID"]),
              expected_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              expected_suite_sha256=os.environ["SUITE_SHA"],
          )
          assert result["status"] == "supervisor_recorded_passed_origin_authenticated"
          assert result["artifact_origin_verified"] is True
          assert result["test_outcome_proven"] is False
          assert result["test_execution_platform_proven"] is False
          assert result["github_publication"] == result["merge_action"] == "none"
          Path("verified.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print("Authenticated GitHub artifact and supervisor record")
          PY
      - name: Modified execution record must fail closed
        run: |
          set -euo pipefail
          cd /tmp/daddy-attested-tests
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("supervised.json")
          data = json.loads(p.read_text())
          data["exit_code"] = 1
          p.write_text(json.dumps(data, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          export BUNDLE="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          export GH_BIN="$(readlink -f "$(command -v gh)")"
          export GH_BIN_SHA="$(sha256sum "$GH_BIN" | cut -d ' ' -f 1)"
          export ORIGINAL_SHA="$(python -c 'import json;print(json.load(open("verified.json"))["artifact_sha256"])')"
          export SUITE_SHA="$(sha256sum "$GITHUB_WORKSPACE/tests/test_human_quality.py" | cut -d ' ' -f 1)"
          if python - <<'PY'
          import os
          from pathlib import Path
          from daddy_reviews.test_execution import verify_execution_with_github_attestation
          verify_execution_with_github_attestation(
              artifact_file=Path("supervised.json"), bundle_file=Path(os.environ["BUNDLE"]),
              trusted_root_file=Path("trusted_root.jsonl"),
              gh_binary=Path(os.environ["GH_BIN"]), gh_binary_sha256=os.environ["GH_BIN_SHA"],
              expected_repo=os.environ["GITHUB_REPOSITORY"],
              expected_repo_id=int(os.environ["GITHUB_REPOSITORY_ID"]),
              expected_commit=os.environ["GITHUB_SHA"],
              signer_workflow=os.environ["GITHUB_REPOSITORY"] +
                  "/.github/workflows/attested-test-execution.yml",
              expected_artifact_sha256=os.environ["ORIGINAL_SHA"],
              expected_run_id=int(os.environ["GITHUB_RUN_ID"]),
              expected_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              expected_suite_sha256=os.environ["SUITE_SHA"],
          )
          PY
          then
            echo "Tampered test evidence incorrectly accepted" >&2
            exit 1
          fi
          echo "Tampering rejected"
