[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "daddy-reviews"
version = "1.3.0"
description = "Evidence-first, calibrated repository engineering review"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
daddy-reviews = "daddy_reviews.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
